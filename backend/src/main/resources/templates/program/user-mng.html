<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사용자 관리 · 패션 트렌드 분석</title>
    <link rel="stylesheet" href="/css/common-ui.css">
    <link rel="stylesheet" href="/css/grid.css">
    <style>
        /* 화면 공통 뼈대(:root, .app-shell, .btn 등)는 common-ui.css가, .grid 공통 모양(패딩 포함)은
           grid.css가 담당한다. 여기는 이 화면에서만 다른 값(역할 select 폭)만 남긴다. */
        .grid td select{ width:110px; }
    </style>
</head>
<body>
<div class="app-shell" th:classappend="${param.embed} ? 'app-shell--embedded'">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <main class="area-main">
        <section th:replace="~{fragments/page-toolbar :: toolbar}"></section>

        <section class="search-row" id="searchArea"></section>

        <section class="panel-head">
            <div class="panel-title">사용자 목록</div>
        </section>

        <section>
            <table class="grid">
                <thead id="userGridHead"></thead>
                <tbody id="userGridBody"></tbody>
            </table>
        </section>
    </main>
</div>

<script src="/js/grid.js"></script>
<script src="/js/search-form.js"></script>
<script src="/js/com-cd.js"></script>
<script th:inline="javascript">
    (function () {
        const API_URL = '/api/users';
        const gridBody = document.getElementById('userGridBody');

        // 자기 자신·자신보다 높은 역할의 계정은 서버가 editable=false로 내려준다. 잠그고 저장에서도 뺀다.
        // 자기 자신(self)은 비밀번호만 열어 둔다.
        function locked(value, row) {
            return !!(row && row.id && !row.editable);
        }

        function passwordLocked(value, row) {
            return locked(value, row) && !row.self;
        }

        // 역할 옵션: 잠긴 행은 현재 값을 보여 주도록 전체, 나머지는 내가 줄 수 있는 역할만.
        let roleOptions = [];
        let assignableRoleOptions = [];

        const COLUMNS = [
            { type: 'row-select', width: 36, align: 'center', disabled: locked },
            { id: 'username', label: '아이디', type: 'text', disabled: locked },
            { id: 'userNm', label: '사용자명', type: 'text', disabled: locked },
            {
                id: 'password', label: '비밀번호', type: 'password', disabled: passwordLocked,
                placeholder: function (user) { return (user && user.id) ? '변경 시에만 입력' : '필수 입력'; }
            },
            {
                // 역할 값은 공통코드관리 화면(그룹 "ROLE")에서 관리한다.
                id: 'role', label: '역할', type: 'select', defaultValue: 'USER', disabled: locked,
                options: function (row) { return locked(null, row) ? roleOptions : assignableRoleOptions; }
            },
            // 끄면 그 계정은 로그인할 수 없다.
            { id: 'useYn', label: '사용여부', type: 'checkbox', width: 80, align: 'center', disabled: locked }
        ];

        Grid.renderHeader(document.getElementById('userGridHead'), COLUMNS);

        const search = SearchForm.render(document.getElementById('searchArea'), [
            { id: 'username', label: '아이디', type: 'text' },
            { id: 'userNm', label: '사용자명', type: 'text' }
        ], { onSearch: searchUsers });

        // 조회조건은 화면에서 거른다(search.matches) — /api/users는 사용자별 권한관리 화면도 전체
        // 목록으로 쓰므로 API는 그대로 둔다(프로그램 관리 화면과 같은 방식).
        function renderRows(users) {
            Grid.render(gridBody, COLUMNS, (users || []).filter(search.matches), { emptyMessage: '등록된 사용자가 없습니다.' });
        }

        /** 역할 공통코드와 내가 줄 수 있는 역할을 한 번 받아 둔다. */
        function loadRoleOptions() {
            return Promise.all([
                ComCd.fetchCodes('ROLE'),
                fetch(API_URL + '/assignable-roles').then(function (res) {
                    if (!res.ok) throw new Error('역할 조회에 실패했습니다.');
                    return res.json();
                })
            ]).then(function (results) {
                roleOptions = results[0].map(function (code) { return { value: code.codeValue, label: code.codeName }; });
                assignableRoleOptions = roleOptions.filter(function (opt) { return results[1].includes(opt.value); });
            });
        }

        function searchUsers() {
            fetch(API_URL)
                .then(function (res) {
                    if (!res.ok) throw new Error('조회에 실패했습니다.');
                    return res.json();
                })
                .then(renderRows)
                .catch(function (err) {
                    alert(err.message);
                });
        }

        function addRow() {
            Grid.addRow(gridBody);
        }

        function saveAll() {
            const requests = [];

            for (const row of Grid.getRows(gridBody)) {
                if (row.self) {
                    // 본인은 비밀번호를 입력했을 때만 보낸다(서버도 비밀번호 외 값은 무시).
                    if (row.password) {
                        requests.push(fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: row.id, password: row.password })
                        }));
                    }
                    continue;
                }
                if (locked(null, row)) {
                    continue;
                }
                const username = row.username;
                const userNm = row.userNm;
                const password = row.password;
                const role = row.role;
                const isExisting = !row._isNew;

                if (!username && !userNm && !password) {
                    continue;
                }
                if (!username || !userNm) {
                    alert('아이디, 사용자명은 필수입니다.');
                    return;
                }
                if (!isExisting && !password) {
                    alert('신규 사용자는 비밀번호가 필수입니다.');
                    return;
                }

                const payload = {
                    id: isExisting ? row.id : null,
                    username: username,
                    userNm: userNm,
                    password: password,
                    role: role,
                    useYn: row.useYn
                };

                requests.push(fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }));
            }

            if (requests.length === 0) {
                return;
            }

            Promise.all(requests)
                .then(function (results) {
                    if (results.some(function (res) { return !res.ok; })) {
                        throw new Error('저장에 실패했습니다.');
                    }
                    searchUsers();
                })
                .catch(function (err) {
                    alert(err.message);
                });
        }

        function deleteSelected() {
            const rows = Grid.getRows(gridBody).filter(function (row) { return row._selected; });
            if (rows.length === 0) {
                alert('삭제할 사용자를 목록에서 선택하세요.');
                return;
            }
            if (!confirm('선택한 사용자를 삭제하시겠습니까?')) {
                return;
            }

            const requests = rows
                .filter(function (row) { return !row._isNew; })
                .map(function (row) { return fetch(API_URL + '/' + row.id, { method: 'DELETE' }); });

            // 저장 전 신규 행은 서버에 없으니 화면에서만 지운다.
            Grid.removeRows(gridBody, rows.filter(function (row) { return row._isNew; }));

            if (requests.length === 0) {
                return;
            }

            Promise.all(requests)
                .then(function (results) {
                    if (results.some(function (res) { return !res.ok; })) {
                        throw new Error('삭제에 실패했습니다.');
                    }
                    searchUsers();
                })
                .catch(function (err) {
                    alert(err.message);
                });
        }

        PageButtons.bind({
            btnSearch: searchUsers,
            btnAdd: addRow,
            btnSave: saveAll,
            btnDelete: deleteSelected,
            btnReset: function () {
                search.reset();
                searchUsers();
            }
        });

        loadRoleOptions()
            .then(searchUsers)
            .catch(function (err) {
                alert(err.message);
            });
    })();
</script>
</body>
</html>
