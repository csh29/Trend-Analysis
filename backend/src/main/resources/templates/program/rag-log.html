<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>챗봇 질문 로그 · 패션 트렌드 분석</title>
    <link rel="stylesheet" href="/css/common-ui.css">
    <link rel="stylesheet" href="/css/grid.css">
    <style>
        /* 화면 공통 뼈대는 common-ui.css, 그리드는 grid.css가 담당한다. 여기는 요약 줄과 행 팝업만. */
        .log-summary{ font-size:12px; color:var(--text-sub); font-weight:normal; margin-left:6px; }
        .log-modal{ max-width:820px; max-height:90vh; overflow:auto; }
        .log-modal pre{ white-space:pre-wrap; word-break:break-word; margin:0; font:inherit; }
    </style>
</head>
<body>
<div class="app-shell" th:classappend="${param.embed} ? 'app-shell--embedded'">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <main class="area-main">
        <section th:replace="~{fragments/page-toolbar :: toolbar}"></section>

        <section class="search-row" id="searchArea"></section>

        <section class="panel-head">
            <div class="panel-title">질문 로그<span class="log-summary" id="logSummary"></span></div>
        </section>

        <section>
            <table class="grid">
                <thead id="logGridHead"></thead>
                <tbody id="logGridBody"></tbody>
            </table>
        </section>
    </main>
</div>

<!-- 행을 누르면 질문·답 전체 -->
<div class="modal-backdrop" id="logBackdrop">
    <div class="modal log-modal">
        <h3 id="logTitle">질문 로그</h3>
        <dl class="detail-list" id="logDetail"></dl>
        <div class="modal-actions">
            <button type="button" class="btn" id="logClose">닫기</button>
        </div>
    </div>
</div>

<script src="/js/grid.js"></script>
<script src="/js/com-cd.js"></script>
<script src="/js/search-form.js"></script>
<script>
    (function () {
        const API_URL = '/api/rag-logs';
        const gridBody = document.getElementById('logGridBody');
        const ROUTES = { AGENT: '도구 경로', TREND: '집계(고정)', SEARCH: '검색', OFF_TOPIC: '범위 밖' };
        const FEEDBACKS = { UP: '👍', DOWN: '👎' };

        const COLUMNS = [
            { id: 'askedAtText', label: '일시', width: 140, align: 'center' },
            { id: 'username', label: '사용자', width: 90, align: 'center' },
            { id: 'question', label: '질문', title: true },
            { id: 'routeText', label: '경로', width: 90, align: 'center' },
            { id: 'groundedText', label: '근거', width: 60, align: 'center' },
            { id: 'feedbackText', label: '피드백', width: 60, align: 'center' },
            { id: 'tokens', label: '토큰(입력)', width: 90, align: 'right' },
            { id: 'seconds', label: '소요(초)', width: 80, align: 'right' }
        ];

        Grid.renderHeader(document.getElementById('logGridHead'), COLUMNS, { sortable: true });

        const search = SearchForm.render(document.getElementById('searchArea'), [
            {
                id: 'days', label: '기간', type: 'select', width: 110, defaultValue: '30', onChange: searchLogs,
                options: [{ value: '1', label: '오늘' }, { value: '7', label: '최근 7일' }, { value: '30', label: '최근 30일' },
                    { value: '90', label: '최근 90일' }, { value: '180', label: '최근 180일' }]
            },
            {
                id: 'feedback', label: '피드백', type: 'select', withAll: true, width: 110, onChange: searchLogs,
                options: [{ value: 'UP', label: '👍' }, { value: 'DOWN', label: '👎' }, { value: 'NONE', label: '없음' }]
            },
            {
                id: 'route', label: '경로', type: 'select', withAll: true, width: 120, onChange: searchLogs,
                options: Object.keys(ROUTES).map(function (k) { return { value: k, label: ROUTES[k] }; })
            }
        ], { onSearch: searchLogs });

        /** 로컬 날짜(YYYY-MM-DD) — toISOString은 UTC라 오전 9시 전에 하루 밀린다. */
        function localDate(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function renderRows(logs) {
            const rows = (logs || []).map(function (l) {
                return Object.assign({}, l, {
                    askedAtText: String(l.askedAt || '').replace('T', ' ').substring(0, 16),
                    routeText: ROUTES[l.route] || l.route,
                    groundedText: l.grounded ? '있음' : '없음',
                    feedbackText: FEEDBACKS[l.feedback] || '',
                    tokens: l.inputTokens,
                    seconds: Math.round(l.elapsedMs / 100) / 10
                });
            });
            const up = rows.filter(function (r) { return r.feedback === 'UP'; }).length;
            const down = rows.filter(function (r) { return r.feedback === 'DOWN'; }).length;
            const avg = function (key) {
                return rows.length ? Math.round(rows.reduce(function (s, r) { return s + r[key]; }, 0) / rows.length * 10) / 10 : 0;
            };
            document.getElementById('logSummary').textContent = rows.length
                ? '(' + rows.length + '건 · 👍 ' + up + ' · 👎 ' + down + ' · 평균 ' + avg('seconds') + '초 · 입력 토큰 평균 '
                    + Math.round(avg('tokens')).toLocaleString() + ')'
                : '';
            Grid.render(gridBody, COLUMNS, rows, {
                emptyMessage: '기간 안에 질문이 없습니다.',
                onRowClick: function (tr, row) { openLog(row); }
            });
        }

        function searchLogs() {
            const v = search.values();
            const to = new Date();
            const from = new Date();
            from.setDate(to.getDate() - (Number(v.days) || 30) + 1);
            const params = new URLSearchParams({ from: localDate(from), to: localDate(to) });
            if (v.feedback) params.set('feedback', v.feedback);
            if (v.route) params.set('route', v.route);
            fetch(API_URL + '?' + params.toString())
                .then(function (res) {
                    if (!res.ok) throw new Error('조회에 실패했습니다.');
                    return res.json();
                })
                .then(renderRows)
                .catch(function (err) { alert(err.message); });
        }

        // ── 행 팝업: 질문·답 전체 ──────────────────────────────────
        const backdrop = document.getElementById('logBackdrop');

        function addRow(dl, label, value, pre) {
            const dt = document.createElement('dt');
            dt.textContent = label;
            const dd = document.createElement('dd');
            if (pre) {
                const p = document.createElement('pre');
                p.textContent = value || '-';
                dd.appendChild(p);
            } else {
                dd.textContent = value === null || value === undefined || value === '' ? '-' : value;
            }
            dl.append(dt, dd);
        }

        function openLog(row) {
            document.getElementById('logTitle').textContent = row.askedAtText + ' · ' + row.username;
            const dl = document.getElementById('logDetail');
            dl.replaceChildren();
            addRow(dl, '질문', row.question);
            if (row.resolvedQuestion) addRow(dl, '이렇게 이해함', row.resolvedQuestion);
            addRow(dl, '경로', row.routeText + (row.reason ? ' (' + row.reason + ')' : ''));
            addRow(dl, '답', row.answerText, true);
            addRow(dl, '출처 원문', (row.sourceDocIds || '').split(',').filter(Boolean).join(', '));
            addRow(dl, '토큰', '입력 ' + row.inputTokens.toLocaleString() + ' · 출력 ' + row.outputTokens.toLocaleString());
            addRow(dl, '소요', row.seconds + '초');
            addRow(dl, '피드백', row.feedbackText);
            backdrop.classList.add('open');
        }

        function closeLog() {
            backdrop.classList.remove('open');
        }

        document.getElementById('logClose').addEventListener('click', closeLog);
        backdrop.addEventListener('click', function (e) {
            if (e.target === backdrop) closeLog();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && backdrop.classList.contains('open')) closeLog();
        });

        PageButtons.bind({
            btnSearch: searchLogs,
            btnReset: function () {
                search.reset();
                searchLogs();
            }
        });

        search.ready.then(searchLogs);
    })();
</script>
</body>
</html>
