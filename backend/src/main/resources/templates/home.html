<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>패션 트렌드 분석</title>
    <link rel="stylesheet" href="/css/common-ui.css">
    <style>
        /* 화면 공통 뼈대(:root, .app-shell 등)는 common-ui.css가 담당한다. 여기는 이 화면 전용
           위젯(요약 카드, 막대 차트, 질문창·답변)만 남긴다. security-monitoring 홈과 같은 구조다. */
        #homePanel{ display:flex; flex-direction:column; gap:20px; }

        /* 자동 새로고침 — 카드 위 오른쪽에 작게. 갱신 실패는 경고색으로 시각과 함께 남긴다. */
        .refresh-bar{ display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-bottom:-8px; font-size:12px; color:var(--text-sub); }
        .refresh-bar label{ display:flex; align-items:center; gap:4px; cursor:pointer; }
        .refresh-bar .is-error{ color:var(--accent); font-weight:700; }

        /* 트렌드 집계(P-05)와 분석 현황(P-03)을 좌우 카드로 나란히 둔다. */
        .overview{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:20px; }
        .domain-card{
            background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
            padding:20px 22px; display:flex; flex-direction:column; gap:16px;
        }
        .domain-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
        .domain-title{ font-size:15px; font-weight:800; color:var(--navy); }
        .domain-desc{ font-size:12px; color:var(--text-sub); margin-top:4px; }
        .domain-link{
            flex:none; border:none; background:none; cursor:pointer; font:inherit;
            font-size:12px; font-weight:700; color:var(--accent); white-space:nowrap;
        }
        .domain-link:hover{ text-decoration:underline; }

        /* 대표 수치 하나 + 보조 수치 둘. 0이면 경고색을 빼서 "변화 없음"이 한눈에 보이게 한다. */
        .domain-main{ display:flex; align-items:baseline; gap:6px; }
        .domain-main .big{ font-size:40px; font-weight:800; line-height:1; color:var(--accent); }
        .domain-main.is-zero .big{ color:var(--navy); }
        .domain-main .unit{ font-size:16px; font-weight:700; color:var(--navy); }
        .domain-main .big-lbl{ font-size:13px; color:var(--text-sub); margin-left:8px; }
        .domain-stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .domain-stats > div{ background:var(--bg); border-radius:10px; padding:10px 14px; }
        .domain-stats b{ display:block; font-size:18px; font-weight:800; color:var(--navy); }
        .domain-stats span{ display:block; font-size:11.5px; color:var(--text-sub); margin-top:2px; }

        .domain-bars-title{ font-size:12px; font-weight:700; color:var(--text-sub); padding-top:14px; border-top:1px solid var(--line); }

        /* 가로 막대 차트(fragments/rank-bars.html) */
        .bars-empty{ font-size:13px; color:var(--text-sub); margin-top:10px; }
        .bars{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
        .bar-row{ display:grid; grid-template-columns:110px 1fr; align-items:center; gap:12px; }
        .bar-row .cap{ font-size:12px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .bar-row .track{ display:flex; align-items:center; gap:8px; }
        .bar-row .fill{ height:10px; border-radius:3px; background:var(--accent); }
        .bar-row .num{ font-size:11px; color:var(--text-sub); }

        /* 질문창(P-06 RAG). 입력은 한 줄, Enter로 질문한다. */
        /* 상자 어디를 눌러도 입력칸에 들어가게 — 입력칸이 상자 높이를 꽉 채우고(위아래 여백은 입력칸 안쪽), 아이콘·빈 곳도 label이라 누르면 포커스 */
        .search{
            display:flex; align-items:stretch; gap:10px; cursor:text;
            border:1px solid var(--line); border-radius:var(--radius-md);
            padding:0 8px 0 16px; background:#fafafd;
        }
        .search:focus-within{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
        .search .ico{ display:flex; align-items:center; font-size:15px; color:#b6b6cc; }
        .search input{ flex:1; min-width:0; padding:16px 0; border:none; outline:none; background:transparent; font:inherit; font-size:13px; color:var(--text); cursor:text; }
        .search .btn{ align-self:center; cursor:pointer; }
        .search input::placeholder{ color:#b6b6cc; }

        /* 답변 박스 — 결론 한 줄(굵게) → 글머리 줄(줄 끝에 인용 번호) → 번호 붙은 출처 목록 → 검색 정보.
           한 덩어리 글에 [1][2]가 섞여 읽기 어렵던 것을 나눴다(2026-10-22). 번호를 누르면 그 출처로 간다. */
        .result{ border:1px solid var(--line); border-radius:var(--radius-md); padding:18px 22px; background:var(--card);
            display:flex; flex-direction:column; gap:14px; }
        .result[hidden]{ display:none; }
        .result .q{ font-size:12px; font-weight:700; color:var(--text-sub); display:flex; align-items:center; gap:8px; }
        .result .q .badge{ margin-left:auto; }
        .answer-lead{ font-size:15px; font-weight:800; color:var(--navy); line-height:1.5; }
        .answer-lead.none{ font-size:13.5px; font-weight:600; color:var(--text-sub); }
        .answer-points{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
        .answer-points li{ position:relative; padding-left:16px; font-size:13.5px; line-height:1.65; color:var(--text); }
        .answer-points li::before{ content:''; position:absolute; left:3px; top:.7em; width:5px; height:5px; border-radius:50%; background:var(--accent); }
        .cite{
            display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px;
            margin-left:4px; vertical-align:1px; border:none; border-radius:9px; cursor:pointer;
            background:var(--accent-soft); color:var(--accent); font:inherit; font-size:10.5px; font-weight:800; line-height:1;
        }
        .cite:hover, .cite:focus-visible{ background:var(--accent); color:#fff; outline:none; }

        .answer-sources{ border-top:1px solid var(--line); padding-top:12px; }
        .answer-sources h4{ margin:0 0 8px; font-size:12px; font-weight:700; color:var(--text-sub); }
        .answer-sources ol{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
        .answer-sources li{ display:grid; grid-template-columns:24px minmax(0, 1fr); gap:10px; padding:8px 10px; border-radius:8px; transition:background .3s; }
        .answer-sources li.is-flash{ background:var(--accent-soft); }
        .answer-sources .n{ width:22px; height:22px; border-radius:11px; background:var(--navy); color:#fff;
            font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
        .answer-sources .head{ display:flex; align-items:baseline; gap:8px; min-width:0; }
        .answer-sources .title{ font-size:13px; font-weight:700; color:var(--text); text-decoration:none;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
        .answer-sources a.title:hover, .answer-sources button.title:hover{ color:var(--accent); text-decoration:underline; }
        .answer-sources button.title{ border:none; background:none; padding:0; cursor:pointer; font:inherit; font-size:13px; font-weight:700; text-align:left; }

        /* 이미지 출처 패널 — 이미지만 있는 원문은 새 탭 대신 오른쪽에서 밀려 나와 사진과 분석 요약을 같이 보여 준다 */
        .src-drawer-backdrop{ position:fixed; inset:0; background:rgba(25,25,64,.25); opacity:0; pointer-events:none; transition:opacity .2s; z-index:900; }
        .src-drawer-backdrop.open{ opacity:1; pointer-events:auto; }
        .src-drawer{
            position:fixed; top:0; right:0; bottom:0; width:min(440px, 92vw); z-index:901;
            background:var(--card); border-left:1px solid var(--line); box-shadow:-8px 0 24px rgba(25,25,64,.12);
            transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column;
        }
        .src-drawer.open{ transform:translateX(0); }
        .src-drawer .drawer-head{ display:flex; align-items:flex-start; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line); }
        .src-drawer .drawer-head .n{ flex:none; width:22px; height:22px; border-radius:11px; background:var(--navy); color:#fff;
            font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
        .src-drawer .drawer-title{ flex:1; min-width:0; font-size:14px; font-weight:800; color:var(--navy); word-break:break-all; }
        .src-drawer .drawer-info{ margin-top:2px; font-size:11.5px; font-weight:400; color:var(--text-sub); }
        .src-drawer .drawer-close{ flex:none; width:28px; height:28px; border:none; border-radius:6px; background:none;
            font-size:18px; line-height:1; color:var(--text-sub); cursor:pointer; }
        .src-drawer .drawer-close:hover{ background:var(--bg); color:var(--text); }
        .src-drawer .drawer-body{ flex:1; overflow:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px; }
        .src-drawer .drawer-img{ display:block; width:100%; max-height:60vh; object-fit:contain; background:var(--bg); border-radius:10px; }
        .src-drawer .drawer-text{ font-size:12.5px; line-height:1.7; color:var(--text); white-space:pre-wrap; }
        .answer-sources .info{ flex:none; font-size:11.5px; color:var(--text-sub); white-space:nowrap; }
        .answer-sources .excerpt{ margin-top:2px; font-size:12px; line-height:1.5; color:var(--text-sub);
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .result .meta{ font-size:11px; color:var(--text-sub); }
        .period-notice{ font-size:12px; color:#b8860b; background:#fff3d6; border-radius:8px; padding:8px 12px; }
        /* 질문을 어떻게 알아들었는지(유행 질문·범위·해석 주체) — 질문 줄 아래 작은 글씨 */
        .result .interp{ font-size:11.5px; color:var(--text-sub); margin-top:-8px; }
        /* 유행 질문의 판단 근거 집계 — 주 축(아이템 종류)은 막대, 나머지 축은 한 줄 요약 */
        .facts-box{ background:var(--bg); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
        .facts-box[hidden]{ display:none; }
        .facts-box .facts-head{ font-size:12px; font-weight:700; color:var(--text-sub); }
        .facts-box .bars{ margin-top:0; gap:6px; }
        .facts-box .bar-row{ grid-template-columns:150px 1fr; }
        .facts-box .facts-line{ font-size:12px; color:var(--text); line-height:1.6; }
        .facts-box .facts-line b{ color:var(--text-sub); font-weight:700; margin-right:6px; }
        .period-notice[hidden]{ display:none; }
        .answer-points[hidden], .answer-sources[hidden]{ display:none; } /* display:flex가 hidden 속성을 이기지 않게 */

        /* 좁으면 위아래로 */
        @media (max-width:1100px){
            .overview{ grid-template-columns:1fr; }
        }

        /* 홈 화면이 탭 셸 역할도 한다 — 사이드바에서 홈 외 메뉴를 열면 이 안에 탭(iframe)이
           쌓인다. 탭이 있을 땐 홈 내용을 숨기고 탭 영역을 그 자리(.area-main)에 꽉 채운다. */
        .area-main{ position:relative; }
        #homePanel.hidden{ display:none; }
        #tabPanels{ display:none; position:absolute; inset:0; background:var(--bg); }
        #tabPanels.active{ display:block; }
        #tabPanels .tab-iframe{ display:none; width:100%; height:100%; border:none; }
    </style>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <main class="area-main">
        <div id="homePanel">
            <div class="refresh-bar">
                <span id="homeRefreshedAt"></span>
                <label><input type="checkbox" id="homeAutoRefresh"> 자동 새로고침(1분)</label>
                <button type="button" class="btn" id="homeRefreshNow">새로고침</button>
            </div>
            <!-- 카드 링크는 사이드바 메뉴를 대신 눌러 탭으로 연다(tabs.js — 홈이 탭 셸이라 일반 링크로 가면 탭 화면을 벗어난다).
                 권한이 없어 메뉴가 없으면 눌러도 아무 일도 없다. -->
            <div class="overview" th:with="h=${home}">
                <section class="domain-card">
                    <div class="domain-head">
                        <div>
                            <div class="domain-title">트렌드 집계</div>
                            <div class="domain-desc" th:if="${h.statsWeek != null}"
                                 th:text="|기준 주 ${#temporals.format(h.statsWeek, 'MM/dd')} ~ ${#temporals.format(h.statsWeek.plusDays(6), 'MM/dd')}${h.currentWeek ? ' (진행 중)' : ''} · 전주 대비 +20% 이상이 급상승|">기준 주</div>
                            <div class="domain-desc" th:if="${h.statsWeek == null}">아직 집계가 없습니다.</div>
                        </div>
                        <button type="button" class="domain-link" data-open-menu="trend-analysis">트렌드 분석 ›</button>
                    </div>
                    <div class="domain-main" th:classappend="${h.surgeKeywordCount == 0} ? 'is-zero'">
                        <span class="big" th:text="${h.surgeKeywordCount}">0</span><span class="unit">개</span>
                        <span class="big-lbl">급상승 키워드</span>
                    </div>
                    <div class="domain-stats">
                        <div><b th:text="|${h.newKeywordCount}개|">0개</b><span>신규 키워드 (전주 0건)</span></div>
                        <div><b th:text="|${h.keywordCount}개|">0개</b><span>기준 주 키워드 종류</span></div>
                    </div>
                    <div>
                        <div class="domain-bars-title">키워드 언급 TOP 5</div>
                        <div th:replace="~{fragments/rank-bars :: rankBars(${h.topKeywords}, '기준 주에 집계된 키워드가 없습니다.')}"></div>
                    </div>
                </section>

                <section class="domain-card">
                    <div class="domain-head">
                        <div>
                            <div class="domain-title">분석 현황</div>
                            <div class="domain-desc">업로드·등록한 원문의 AI 정형화 (P-03)</div>
                        </div>
                        <button type="button" class="domain-link" data-open-menu="img-upload">이미지 업로드 ›</button>
                    </div>
                    <div class="domain-main">
                        <span class="big" th:text="${h.doneCount}">0</span><span class="unit">건</span>
                        <span class="big-lbl">분석 완료</span>
                    </div>
                    <div class="domain-stats">
                        <div><b th:text="|${h.pendingCount}건|">0건</b><span>대기·처리 중</span></div>
                        <div><b th:text="|${h.failedCount}건|">0건</b><span>실패 (재분석 필요)</span></div>
                    </div>
                    <div>
                        <div class="domain-bars-title">카테고리 언급 TOP 5 (기준 주)</div>
                        <div th:replace="~{fragments/rank-bars :: rankBars(${h.topCategories}, '기준 주에 집계된 카테고리가 없습니다.')}"></div>
                    </div>
                </section>
            </div>

            <!-- P-06 RAG: 분석이 끝난 자료 안에서만 답하고, 근거가 기준 유사도에 못 미치면 "근거 자료 없음". -->
            <label class="search" for="ragQuestion">
                <span class="ico">⌕</span>
                <input type="text" id="ragQuestion" maxlength="500" autocomplete="off"
                       placeholder="트렌드를 물어보세요 — 예) 요즘 유행하는 와이드 팬츠 스타일은?">
                <button type="button" class="btn primary" id="ragAsk">질문</button>
            </label>

            <div class="result" id="ragResult" hidden>
                <div class="q"><span id="ragResultQ"></span><span class="badge" id="ragBadge"></span></div>
                <div class="interp" id="ragInterp"></div>
                <div class="period-notice" id="ragPeriodNotice" hidden></div>
                <div class="answer-lead" id="ragAnswer"></div>
                <ul class="answer-points" id="ragPoints"></ul>
                <div class="facts-box" id="ragFacts" hidden></div>
                <div class="answer-sources" id="ragSourcesBox">
                    <h4>출처</h4>
                    <ol id="ragSources"></ol>
                </div>
                <div class="meta" id="ragMeta"></div>
            </div>
        </div>

        <div id="tabPanels"></div>
    </main>
</div>

<!-- 이미지 출처 패널(RAG 출처 중 이미지만 있는 원문). 링크가 있는 원문은 새 탭으로 연다. -->
<div class="src-drawer-backdrop" id="srcDrawerBackdrop"></div>
<aside class="src-drawer" id="srcDrawer" aria-hidden="true" aria-labelledby="srcDrawerTitle">
    <div class="drawer-head">
        <span class="n" id="srcDrawerN"></span>
        <div class="drawer-title"><div id="srcDrawerTitle"></div><div class="drawer-info" id="srcDrawerInfo"></div></div>
        <button type="button" class="drawer-close" id="srcDrawerClose" title="닫기 (Esc)">×</button>
    </div>
    <div class="drawer-body">
        <img class="drawer-img" id="srcDrawerImg" alt="">
        <div class="drawer-text" id="srcDrawerText"></div>
    </div>
</aside>

<script src="/js/tabs.js"></script>
<script>
    // 카드의 "… ›" 버튼 — 같은 화면의 사이드바 메뉴를 대신 눌러 탭 동작(tabs.js)을 그대로 쓴다.
    document.getElementById('homePanel').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-open-menu]');
        if (!btn) return;
        const link = document.querySelector('.nav a[data-menu="' + btn.dataset.openMenu + '"]');
        if (link) link.click();
    });

    /**
     * 자동 새로고침(security-monitoring 홈과 같은 방식). 페이지를 다시 읽으면 열린 탭과 질문창의 답이 사라지므로, 서버가 그린
     * 홈을 받아 카드 영역(.overview)만 바꿔 끼운다. 홈이 보일 때만 돌고(다시 보일 때 주기가 지났으면 바로 갱신),
     * 켜고 끈 상태는 이 브라우저에만 기억한다. 분석이 끝나거나 집계가 돌면 숫자가 바뀐다.
     */
    (function () {
        const INTERVAL_MS = 60 * 1000;
        const STORAGE_KEY = 'home.autoRefresh';
        const panel = document.getElementById('homePanel');
        const toggle = document.getElementById('homeAutoRefresh');
        const stamp = document.getElementById('homeRefreshedAt');
        let lastRefreshed = Date.now();
        let inFlight = false;

        function timeText(date) {
            return date.toTimeString().substring(0, 8);
        }

        function showStamp(text, isError) {
            stamp.textContent = text;
            stamp.classList.toggle('is-error', isError);
        }

        function homeVisible() {
            return document.visibilityState === 'visible' && !panel.classList.contains('hidden');
        }

        function refresh() {
            if (inFlight) return;
            inFlight = true;
            fetch('/', { silent: true, headers: { Accept: 'text/html' } })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    // 화면 요청은 세션이 끝나면 401이 아니라 로그인 페이지로 302된다 — 창 전체를 로그인으로 보낸다.
                    if (res.redirected && new URL(res.url).pathname === '/login') {
                        window.top.location.href = '/login';
                        return null;
                    }
                    return res.text();
                })
                .then(function (html) {
                    if (html === null) return;
                    // DOMParser로 만든 문서의 스크립트는 실행되지 않는다. 같은 서버가 그린 템플릿의 카드 영역만 가져온다.
                    const next = new DOMParser().parseFromString(html, 'text/html').querySelector('#homePanel .overview');
                    if (!next) throw new Error('카드 영역 없음');
                    panel.querySelector('.overview').replaceWith(document.importNode(next, true));
                    lastRefreshed = Date.now();
                    showStamp('마지막 갱신 ' + timeText(new Date()), false);
                })
                .catch(function () {
                    // 실패해도 이전 수치는 그대로 두고, 오래된 값이라는 걸 알 수 있게 표시만 바꾼다.
                    showStamp('갱신 실패 ' + timeText(new Date()) + ' · 이전 수치 표시 중', true);
                })
                .finally(function () {
                    inFlight = false;
                });
        }

        function refreshIfStale() {
            if (toggle.checked && homeVisible() && Date.now() - lastRefreshed >= INTERVAL_MS) refresh();
        }

        let saved = null;
        try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { /* 저장소를 못 쓰면 기본값 */ }
        toggle.checked = saved !== 'off';
        showStamp('마지막 갱신 ' + timeText(new Date()), false);

        toggle.addEventListener('change', function () {
            try { localStorage.setItem(STORAGE_KEY, toggle.checked ? 'on' : 'off'); } catch (e) { /* 기억만 못 할 뿐 */ }
            refreshIfStale();
        });
        document.getElementById('homeRefreshNow').addEventListener('click', refresh);

        setInterval(refreshIfStale, 5 * 1000);
        document.addEventListener('visibilitychange', refreshIfStale);
        // 탭을 닫거나 홈으로 돌아오면 tabs.js가 #homePanel의 hidden을 뺀다 — 그때 주기가 지났으면 바로 갱신.
        new MutationObserver(refreshIfStale).observe(panel, { attributes: true, attributeFilter: ['class'] });
    })();

    /** RAG 질문(P-06). 마지막 답 하나만 보여 준다 — 질문·답변은 저장하지 않는다. */
    (function () {
        const input = document.getElementById('ragQuestion');
        const button = document.getElementById('ragAsk');
        const result = document.getElementById('ragResult');
        let asking = false;

        // 모델이 쓴 글은 모두 textContent로만 넣는다(HTML로 해석하지 않는다)
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        /** 줄 끝 인용 번호. 누르면 아래 출처 행으로 스크롤하고 잠깐 강조한다. */
        function citeButton(n, sourcesByN) {
            const btn = el('button', 'cite', String(n));
            btn.type = 'button';
            const s = sourcesByN[n];
            if (s) btn.title = [s.title, s.media, s.statDate].filter(Boolean).join(' · ');
            btn.addEventListener('click', function () {
                const row = document.getElementById('ragSource' + n);
                if (!row) return;
                row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                row.classList.add('is-flash');
                setTimeout(function () { row.classList.remove('is-flash'); }, 1200);
            });
            return btn;
        }

        // ── 이미지 출처 패널 ───────────────────────────────────────
        const drawer = document.getElementById('srcDrawer');
        const drawerBackdrop = document.getElementById('srcDrawerBackdrop');
        const drawerImg = document.getElementById('srcDrawerImg');
        let drawerOpener = null; // 닫으면 연 단추로 포커스를 돌려준다

        function openDrawer(s) {
            drawerOpener = document.activeElement;
            document.getElementById('srcDrawerN').textContent = String(s.n);
            document.getElementById('srcDrawerTitle').textContent = s.title || s.docId;
            document.getElementById('srcDrawerInfo').textContent =
                [s.media, s.statDate, s.score == null ? '집계 예시' : '유사도 ' + s.score.toFixed(3)].filter(Boolean).join(' · ');
            drawerImg.src = s.imageUrl;
            drawerImg.alt = s.title || s.docId;
            // 근거 청크 전체(분석 요약·키워드·아이템별 속성) — 사진과 나란히 보면 무엇을 근거로 답했는지 보인다
            document.getElementById('srcDrawerText').textContent = s.chunk || '';
            drawer.classList.add('open');
            drawerBackdrop.classList.add('open');
            drawer.setAttribute('aria-hidden', 'false');
            document.getElementById('srcDrawerClose').focus();
        }

        function closeDrawer() {
            if (!drawer.classList.contains('open')) return;
            drawer.classList.remove('open');
            drawerBackdrop.classList.remove('open');
            drawer.setAttribute('aria-hidden', 'true');
            if (drawerOpener) drawerOpener.focus();
        }

        document.getElementById('srcDrawerClose').addEventListener('click', closeDrawer);
        drawerBackdrop.addEventListener('click', closeDrawer);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

        function sourceRow(s) {
            const li = el('li');
            li.id = 'ragSource' + s.n;
            li.appendChild(el('span', 'n', String(s.n)));
            const body = el('div');
            const head = el('div', 'head');
            // 이미지만 있는 원문은 오른쪽 패널로, 링크가 있는 원문은 새 탭으로, 둘 다 없으면 글자만
            let title;
            if (s.imageUrl) {
                title = el('button', 'title', s.title || s.docId);
                title.type = 'button';
                title.title = '이미지 보기';
                title.addEventListener('click', function () { openDrawer(s); });
            } else {
                title = el(s.url ? 'a' : 'span', 'title', s.title || s.docId);
                if (s.url) {
                    title.href = s.url;
                    title.target = '_blank';
                    title.rel = 'noopener noreferrer';
                }
            }
            head.append(title, el('span', 'info',
                [s.media, s.statDate, s.docType === 'IMAGE' ? '이미지' : '텍스트'].filter(Boolean).join(' · ')));
            body.appendChild(head);
            // 근거 청크의 첫 줄(요약 문장)만 — 뒤에 붙은 "키워드: …" 같은 색인용 줄은 빼고 보여 준다
            const excerpt = el('div', 'excerpt', (s.chunk || '').split('\n')[0]);
            excerpt.title = (s.score == null ? '집계 예시 원문' : '유사도 ' + s.score.toFixed(3)) + '\n' + s.chunk;
            body.appendChild(excerpt);
            li.appendChild(body);
            return li;
        }

        /** 질문을 어떻게 알아들었는지 — "유행 질문 · 아우터 · AI 해석". 규칙 해석이면 그렇게 적는다(AI 해석 실패). */
        function interpretationText(i) {
            if (!i) return '';
            const scope = i.itemTypeName ? [i.categoryName, i.itemTypeName].filter(Boolean).join(' · ') : (i.categoryName || '전체');
            return (i.trend ? '유행 질문 — 원문 수로 판단' : '자료 검색') + ' · ' + scope + ' · ' + (i.by === 'AI' ? 'AI 해석' : '규칙 해석');
        }

        /** 유행 질문의 판단 근거: 범위·기간·원문 수·매체 수, 주 축은 막대(원문 수·매체 수·직전), 나머지 축은 한 줄. */
        function renderFacts(facts, period) {
            const box = document.getElementById('ragFacts');
            box.replaceChildren();
            box.hidden = !facts;
            if (!facts) return;
            box.appendChild(el('div', 'facts-head', '판단 근거 — ' + facts.scopeLabel
                + (period ? ' · ' + period.label + ' ' + period.from + ' ~ ' + period.to : '')
                + ' · 원문 ' + facts.docCount + '건 · 매체 ' + facts.mediaCount + '곳 (직전 ' + facts.prevDocCount + '건)'));
            (facts.dimensions || []).forEach(function (d, i) {
                if (i === 0) {
                    const bars = el('div', 'bars');
                    const max = d.rows.length ? d.rows[0].count : 0;
                    d.rows.forEach(function (r) {
                        const row = el('div', 'bar-row');
                        const cap = el('span', 'cap', r.label);
                        cap.title = r.label;
                        const track = el('span', 'track');
                        const fill = el('i', 'fill');
                        fill.style.width = (max ? r.count * 100 / max : 0) + '%';
                        track.append(fill, el('span', 'num', r.count + '건 · 매체 ' + r.mediaCount + '곳 · 직전 ' + r.prevCount + '건'));
                        row.append(cap, track);
                        bars.appendChild(row);
                    });
                    box.append(el('div', 'facts-head', d.label), bars);
                } else {
                    const line = el('div', 'facts-line');
                    line.append(el('b', null, d.label), d.rows.map(function (r) { return r.label + ' ' + r.count; }).join(' · '));
                    box.appendChild(line);
                }
            });
        }

        function show(view) {
            document.getElementById('ragResultQ').textContent = 'Q. ' + view.question;
            document.getElementById('ragInterp').textContent = interpretationText(view.interpretation);
            renderFacts(view.facts, view.period);
            const badge = document.getElementById('ragBadge');
            badge.className = 'badge ' + (view.grounded ? 'success' : 'medium');
            badge.textContent = view.grounded ? '근거 ' + view.sources.length + '건' : '근거 없음';

            const answer = document.getElementById('ragAnswer');
            answer.textContent = view.answer;
            answer.classList.toggle('none', !view.grounded);

            const sourcesByN = {};
            view.sources.forEach(function (s) { sourcesByN[s.n] = s; });
            const points = document.getElementById('ragPoints');
            points.replaceChildren.apply(points, (view.points || []).map(function (p) {
                const li = el('li', null, p.text);
                (p.sources || []).forEach(function (n) { li.appendChild(citeButton(n, sourcesByN)); });
                return li;
            }));
            points.hidden = !points.children.length;

            const sources = document.getElementById('ragSources');
            sources.replaceChildren.apply(sources, view.sources.slice()
                .sort(function (a, b) { return a.n - b.n; }).map(sourceRow)); // 번호 순 — 줄의 번호로 찾기 쉽게
            document.getElementById('ragSourcesBox').hidden = !view.sources.length;

            // 기간이 없는 질문은 관련 자료 중 최근 것을 앞세운다 — 가장 최근 근거도 오래됐으면(8주 넘음) 답 위에 알린다
            const p = view.period;
            const notice = document.getElementById('ragPeriodNotice');
            const stale = !!(p && p.stale && view.grounded);
            notice.hidden = !stale;
            if (stale) notice.textContent = '최근 자료가 적어 ' + p.from + ' ~ ' + p.to + ' 자료로 답했습니다. 지금도 유행인지는 출처 날짜를 확인하세요.';
            if (stale && view.facts) notice.textContent = '최근 4주에 자료가 없어 ' + p.from + ' ~ ' + p.to + ' 자료로 셌습니다. 지금도 유행인지는 더 봐야 합니다.';
            let meta;
            if (view.facts) { // 유행 질문 — 기간·집계는 판단 근거 상자에 있다
                meta = '유행 판단은 원문 수·매체 수 집계 기준 · 출처는 그 집계의 예시 원문';
            } else {
                let periodText = '';
                if (p && p.explicit) periodText = '기간 ' + p.label + ' ' + p.from + ' ~ ' + p.to + ' · ';
                else if (p && p.from) periodText = '근거 게시일 ' + p.from + ' ~ ' + p.to + ' (최근 자료 우선) · ';
                meta = periodText + '최고 유사도 ' + (view.bestScore == null ? '-' : view.bestScore.toFixed(3))
                    + ' (기준 ' + view.minScore.toFixed(2) + ')'
                    + (view.statsWeek ? ' · 참고 집계 ' + view.statsWeek + ' 주' : '');
            }
            document.getElementById('ragMeta').textContent = meta;
            result.hidden = false;
        }

        function ask() {
            const question = input.value.trim();
            if (!question) {
                input.focus();
                return;
            }
            if (asking) return;
            asking = true;
            button.disabled = true;
            fetch('/api/rag/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            })
                .then(function (res) {
                    if (!res.ok) return res.text().then(function (msg) { throw new Error(msg || '답변을 받지 못했습니다.'); });
                    return res.json();
                })
                .then(function (view) {
                    show(view);
                    input.value = '';
                })
                .catch(function (err) { alert(err.message); })
                .finally(function () {
                    asking = false;
                    button.disabled = false;
                    input.focus();
                });
        }

        button.addEventListener('click', ask);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.isComposing) { // 한글 조합 중 Enter는 글자 확정이다
                e.preventDefault();
                ask();
            }
        });
    })();
</script>
</body>
</html>
