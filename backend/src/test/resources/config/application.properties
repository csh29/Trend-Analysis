# 테스트 전용 설정 — 기본 application.properties 위에 덮어쓴다(classpath:/config/가 우선). 실행 앱에는 들어가지 않는다.
# 테스트는 메모리 DB로 뜨는데 기동 색인 정리가 돌면 떠 있는 실제 AI 서비스의 색인을 "DB에 없다"며 지운다(2026-10-26 56건 삭제 사고)
index.sync.enabled=false
# 테스트는 고정 날짜의 원문을 나중에 넣는다 — 기동 때 지난주까지 자동 마감하면 그 원문이 전부 '늦게 온 원문'이 되어 이번 주로 옮겨진다
trend.close.auto=false
